[package]
name = "xtshell"
version = "1.2.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "xtshell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
zmodem2 = "0.7"
russh = { version = "0.61", features = ["des"] }
russh-sftp = "2"
tokio-serial = "5"
rmcp = { version = "3", features = ["server", "macros", "transport-streamable-http-server"] }
axum = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
schemars = "1"
thiserror = "2"
serde_yaml = "0.9"
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }

# Linux 主题切换：运行时改 GtkSettings 使原生弹出（select 下拉/右键菜单）跟随应用主题。
# 注意：target 表必须放在普通 [dependencies] 之后（TOML 表头会终结上一个表）。
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# 本地补丁：放宽 mpint 校验，兼容老式交换机主机密钥（详见 vendor/ssh-encoding/src/mpint.rs 注释）
[patch.crates-io]
ssh-encoding = { path = "vendor/ssh-encoding" }
russh = { path = "vendor/russh" }
