name: Release

# 推送 v* 标签或手动触发：三平台（Windows/macOS/Linux）打包并发布到 GitHub Release。
# 注意：macOS 安装包只能在 macOS 上构建（Xcode 工具链限制），因此依赖 CI 的 macOS runner。
# 本地 Windows 交叉编译：见 README 的构建说明，或直接依赖本 workflow 的 windows job。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS：Apple Silicon 与 Intel 各构建一次（macOS 无法在 Linux/Windows 上交叉编译）
          - platform: macos-latest # Apple Silicon (aarch64)
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-13 # Intel (x86_64)
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: windows-latest # NSIS 安装包 + MSI
            target: x86_64-pc-windows-msvc
            args: ""
          - platform: ubuntu-22.04 # deb / AppImage
            target: x86_64-unknown-linux-gnu
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Linux 构建依赖（Tauri v2）
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            upx-ucl

      - name: 安装 UPX（Windows）
        if: matrix.platform == 'windows-latest'
        run: choco install upx --no-progress -y

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "xtshell v__VERSION__"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # 安装包里的二进制已在 beforeBundleCommand 阶段被 UPX 压缩；
      # 这里再把 Windows 的独立 exe 作为便携版附加到同一个 Release。
      - name: 附加 Windows 便携版（UPX）
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          $src = "src-tauri/target/release/xtshell.exe"
          if (-not (Test-Path $src)) {
            $src = (Get-ChildItem -Recurse -Filter xtshell.exe src-tauri/target | Select-Object -First 1).FullName
          }
          if (-not $src -or -not (Test-Path $src)) { Write-Error '找不到编译产物'; exit 1 }
          $dst = "xtshell-$ver-win64-upx.exe"
          Copy-Item $src $dst
          Write-Output ("便携版大小: {0:N2} MB" -f ((Get-Item $dst).Length / 1MB))
          gh release upload "v$ver" $dst --clobber
