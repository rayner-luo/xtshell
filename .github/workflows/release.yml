name: Release

# 推送 v* 标签或手动触发：三平台（Windows/macOS/Linux）打包并发布到 GitHub Release。
# 注意：macOS 安装包只能在 macOS 上构建（Xcode 工具链限制），因此依赖 CI 的 macOS runner。
# 本地 Windows 交叉编译：见 README 的构建说明，或直接依赖本 workflow 的 windows job。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS：Apple Silicon 与 Intel 各构建一次（macOS 无法在 Linux/Windows 上交叉编译）
          - platform: macos-latest # Apple Silicon (aarch64)：仅 dmg
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
          - platform: macos-13 # Intel (x86_64)：仅 dmg
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg
          # Windows：tauri-action 要求至少产出一个 bundle，这里只打 NSIS；
          # 安装包随后由「附加便携版」步骤删除，最终只留 UPX 便携 exe
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: "--bundles nsis"
          # Linux x86_64：deb + rpm（不发 AppImage）
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: "--bundles deb,rpm"
          # Linux aarch64：面向信创机器（鲲鹏/飞腾等 ARM64）
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            args: "--target aarch64-unknown-linux-gnu --bundles deb,rpm"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Linux 构建依赖（Tauri v2）
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            upx-ucl

      - name: 安装 UPX（Windows）
        if: matrix.platform == 'windows-latest'
        run: choco install upx --no-progress -y

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "xtshell v__VERSION__"
          releaseBody: |
            | 平台 | 下载 | 要求 |
            | --- | --- | --- |
            | Windows 10/11 | `xtshell-<ver>-win64-upx.exe`（免安装） | 需 WebView2 运行时 |
            | macOS 12+ | `*.dmg` | Apple Silicon / Intel 两个包 |
            | Linux x86_64 | `*.deb` / `*.rpm` | glibc ≥ 2.35、WebKitGTK 4.1 |
            | Linux arm64（信创） | `*.deb` / `*.rpm` | 同上，面向鲲鹏/飞腾等 ARM64 |

            不兼容：麒麟 V10、统信 UOS 20 及更早版本（glibc 2.28、仅 WebKitGTK 4.0）。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # 安装包里的二进制已在 beforeBundleCommand 阶段被 UPX 压缩；
      # 这里再把 Windows 的独立 exe 作为便携版附加到同一个 Release。
      - name: 清理旧的 AppImage 资产（已改为只发 deb/rpm）
        if: startsWith(matrix.platform, 'ubuntu-')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(node -p "require('./package.json').version")
          gh release view "v$VER" --json assets -q '.assets[].name' 2>/dev/null | grep -i 'AppImage$' | while read -r n; do
            echo "删除 AppImage: $n"
            gh release delete-asset "v$VER" "$n" -y 2>/dev/null || true
          done

      - name: 移除 macOS 的 updater 产物
        if: matrix.platform == 'macos-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(node -p "require('./package.json').version")
          gh release view "v$VER" --json assets -q '.assets[].name' 2>/dev/null | grep 'app.tar.gz$' | while read -r n; do
            echo "删除 updater 产物: $n"
            gh release delete-asset "v$VER" "$n" -y 2>/dev/null || true
          done

      - name: 附加 Windows 便携版（UPX）
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 保险起见再压一次（打包阶段已压过则自动跳过）
          node scripts/upx-binary.mjs
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          $src = "src-tauri/target/release/xtshell.exe"
          if (-not (Test-Path $src)) {
            $src = (Get-ChildItem -Recurse -Filter xtshell.exe src-tauri/target | Select-Object -First 1).FullName
          }
          if (-not $src -or -not (Test-Path $src)) { Write-Error '找不到编译产物'; exit 1 }
          $dst = "xtshell-$ver-win64-upx.exe"
          Copy-Item $src $dst
          Write-Output ("便携版大小: {0:N2} MB" -f ((Get-Item $dst).Length / 1MB))
          gh release upload "v$ver" $dst --clobber

          # 清掉安装包资产（本项目只发便携版）
          $assets = (gh release view "v$ver" --json assets -q '.assets[].name' 2>$null) -split "`n"
          foreach ($n in $assets) {
            if ($n -match 'setup\.exe$' -or $n -match '\.msi$') {
              Write-Output "删除多余资产: $n"
              gh release delete-asset "v$ver" $n -y 2>$null
            }
          }
